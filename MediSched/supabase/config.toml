project_id = "medisched"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://127.0.0.1:5173/index.html"
additional_redirect_urls = ["http://localhost:5173/index.html", "http://127.0.0.1:5500/MediSched/index.html", "http://localhost:5500/MediSched/index.html"]
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

otp_length = 8
otp_expiry = 3600
max_frequency = "60s"
[auth.email.template.confirmation]
subject = "Your MediSched verification code"
content_path = "./supabase/templates/confirm-signup.html"
[functions.appointment-confirmation]
verify_jwt = true
